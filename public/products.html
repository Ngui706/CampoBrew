<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f68b1e">
    <meta name="description" content="Shop TechSips coffee blends, featured products, and merchandise.">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/icon-192.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☕</text></svg>">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:,">
    
    <title>Shop Our Coffee | TechSips</title>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        coffee: { light: '#F5EBE0', DEFAULT: '#D5BDAF', medium: '#C38E70', dark: '#3A2618' }
                    }
                }
            }
        }


    </script>
</head>
<body class="bg-[#f1f1f2] font-sans text-[#313133]">

    <nav class="bg-white shadow-sm sticky top-0 z-50 border-b border-gray-200">
        <div class="max-w-7xl mx-auto flex justify-between items-center px-4 py-3">
            <a href="index.html" class="text-2xl font-bold font-serif text-[#313133]">
                <i class="fa-solid fa-mug-hot text-[#f68b1e] mr-2"></i>TechSips
            </a>
            <nav class="desktop-nav flex items-center gap-5 text-sm font-semibold">
    <a href="index.html" class="hover:text-[#f68b1e]">Home</a>
    <a href="products.html" class="text-[#f68b1e] border-b-2 border-[#f68b1e]">Shop</a>
    
    <a href="checkout.html" id="cart-btn" class="relative group min-h-0">
        <i class="fa-solid fa-cart-shopping text-xl transition-colors group-hover:text-[#f68b1e]"></i>
        <span id="cart-count" class="absolute -top-2 -right-2 bg-[#f68b1e] text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full shadow-sm">
            0
        </span>
    </a>
</nav>
            <div class="nav-toggle ml-4 md:hidden">
                <i class="fa-solid fa-bars"></i>
            </div>
            <div id="mobile-menu" class="hidden md:hidden">
                <a href="products.html">Shop</a>
                <a href="index.html">Home</a>
                <a href="checkout.html">Checkout</a>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-3 sm:px-4 py-5">
        <section class="bg-white border border-gray-200 rounded-md p-4 mb-4">
            <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4">
                <div>
                    <p class="text-xs uppercase tracking-wide text-[#f68b1e] font-bold">TechSips Market</p>
                    <h1 class="text-2xl md:text-3xl font-bold">Coffee, kits, and daily brews</h1>
                </div>
                <div class="flex w-full lg:w-[520px] gap-2">
                    <div class="relative flex-1">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="text" id="search-input" placeholder="Search products, categories..." class="w-full pl-10 pr-3 py-3 rounded border border-gray-300 focus:ring-2 focus:ring-[#f68b1e] outline-none">
                    </div>
                    <button id="search-btn" class="bg-[#f68b1e] text-white px-5 py-2 rounded font-bold hover:bg-[#d86f07] transition">Search</button>
                </div>
            </div>
        </section>

        <section id="featured-section" class="bg-white border border-gray-200 rounded-md mb-4 overflow-hidden hidden">
            <div class="bg-[#f68b1e] text-white px-4 py-3 flex items-center justify-between">
                <h2 class="font-bold text-lg">Featured Products</h2>
                <span class="text-xs font-semibold bg-white/20 px-3 py-1 rounded-full">Priority Picks</span>
            </div>
            <div id="featured-products-grid" class="grid grid-cols-2 md:grid-cols-4 gap-px bg-gray-200"></div>
        </section>

        <div class="flex flex-col lg:flex-row gap-4">
            <aside class="w-full lg:w-64 space-y-4">
                <div class="bg-white border border-gray-200 rounded-md">
                    <h3 class="font-bold text-sm px-4 py-3 border-b">Category</h3>
                    <div id="category-list" class="p-2 space-y-1"></div>
                </div>
                <div class="bg-white border border-gray-200 rounded-md p-4">
                    <h3 class="font-bold text-sm mb-3">Price</h3>
                    <div class="grid grid-cols-2 gap-2">
                        <input id="min-price" type="number" min="0" placeholder="Min" class="border rounded px-3 py-2 text-sm">
                        <input id="max-price" type="number" min="0" placeholder="Max" class="border rounded px-3 py-2 text-sm">
                    </div>
                    <button id="price-btn" class="w-full mt-3 bg-[#313133] text-white rounded py-2 text-sm font-bold hover:bg-black">Apply</button>
                </div>
                <div class="bg-white border border-gray-200 rounded-md p-4">
                    <label class="flex items-center gap-2 text-sm font-semibold">
                        <input id="stock-only" type="checkbox" class="accent-[#f68b1e]">
                        In stock only
                    </label>
                </div>
            </aside>

            <section class="flex-1 min-w-0">
                <div class="bg-white border border-gray-200 rounded-md px-4 py-3 mb-3 flex flex-col md:flex-row md:items-center justify-between gap-3">
                    <div>
                        <h2 class="font-bold">All Products</h2>
                        <p id="result-count" class="text-sm text-gray-500">Loading products...</p>
                    </div>
                    <select id="sort-select" class="border border-gray-300 rounded px-3 py-2 text-sm bg-white">
                        <option value="featured">Sort by featured</option>
                        <option value="price-low">Price: low to high</option>
                        <option value="price-high">Price: high to low</option>
                        <option value="name">Name: A to Z</option>
                    </select>
                </div>
                <div id="product-grid" class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-px bg-gray-200 border border-gray-200 rounded-md overflow-hidden"></div>
            </section>
        </div>
    </main>

    <a href="https://wa.me/254795846971" class="whatsapp-float" target="_blank" rel="noopener noreferrer">
        <i class="fab fa-whatsapp"></i>
    </a>
    <script src="product.js"></script>
    <script src="pwa.js"></script>
</body>
</html>
